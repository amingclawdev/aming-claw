services:
  # Optional self-contained governance demo. The default local development
  # model remains host-side; opt in with `--profile governance-demo` so an
  # already-running host service is never replaced accidentally.
  governance:
    profiles: ["governance-demo"]
    build:
      context: .
      dockerfile: Dockerfile.governance
    ports:
      - "${GOVERNANCE_PORT:-40000}:40000"
    volumes:
      - governance-demo-data:/app/shared-volume
    environment:
      - GOVERNANCE_PORT=40000
      - SHARED_VOLUME_PATH=/app/shared-volume
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:40000/api/health',timeout=2)); raise SystemExit(0 if d.get('status') == 'ok' and not d.get('runtime_stale', False) else 1)"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 12
    restart: unless-stopped

  # Governance is host-side only. This compose file now provides supporting
  # dependencies that the host governance process may still use.

  # --- Telegram Gateway ---
  telegram-gateway:
    build:
      context: .
      dockerfile: Dockerfile.telegram-gateway
    expose:
      - "40010"
    volumes:
      - ./shared-volume/codex-tasks:/app/shared-volume/codex-tasks
    env_file:
      - path: .env
        required: false
    environment:
      - GOVERNANCE_URL=http://host.docker.internal:40000
      - REDIS_URL=redis://redis:6379/0
      - SHARED_VOLUME_PATH=/app/shared-volume
      - TELEGRAM_ADMIN_CHAT_ID=${TELEGRAM_ADMIN_CHAT_ID:-7848961760}
      - GATEWAY_PORT=40010
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # --- Memory Service ---
  dbservice:
    build:
      context: ./dbservice
    expose:
      - "40002"
    ports:
      - "40002:40002"
    volumes:
      - memory-data:/app/db
    environment:
      - DBSERVICE_PORT=40002
      - DBSERVICE_SAVE_PATH=/app/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:40002/health',r=>{process.exit(r.statusCode===200?0:1)})"]
      interval: 10s
      timeout: 5s
      retries: 3

  # --- Redis ---
  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    ports:
      - "40079:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  governance-demo-data:
    driver: local
  redis-data:
    driver: local
  memory-data:
    driver: local
